name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev cmake ninja-build clang-tidy cppcheck clang-format

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOCAPI_ENABLE_CLANG_TIDY=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.h' | xargs clang-format --dry-run --Werror

  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --inline-suppr --std=c++20 --error-exitcode=1 \
            -I src --suppress=missingIncludeSystem --suppress=unknownMacro \
            --suppress=shadowFunction --suppress=useStlAlgorithm \
            src/ tests/

  e2e:
    name: E2E (selenium-webdriver-at-spi, Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libgl1-mesa-dev \
            xvfb dbus-x11 at-spi2-core \
            python3-pip python3-venv python3-gi python3-pyatspi \
            gir1.2-atspi-2.0 gir1.2-gtk-3.0 libgirepository1.0-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2

      - name: Build ocapi
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOCAPI_BUILD_TESTS=OFF
          cmake --build build

      - name: Set up selenium-webdriver-at-spi
        run: |
          git clone --depth 1 https://github.com/KDE/selenium-webdriver-at-spi.git /tmp/swa
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          pip install Appium-Python-Client==4.5.1 Flask==3.0.0 'lxml>=5.0.0' 'selenium==4.29.0' 'numpy>=2.3.3'

      - name: Run E2E tests
        env:
          QT_QPA_PLATFORM: xcb
          QT_ACCESSIBILITY: "1"
          QT_LINUX_ACCESSIBILITY_ALWAYS_ON: "1"
        run: |
          set -eux
          . .venv/bin/activate
          mkdir -p "$RUNNER_TEMP/xdg"/{CACHE,CONFIG,DATA,STATE}
          dbus-run-session -- bash -euo pipefail <<'SCRIPT'
            export DISPLAY=:99
            Xvfb :99 -screen 0 1280x1024x24 &
            trap 'kill %1' EXIT

            # Accessibility bus + registry (what selenium-webdriver-at-spi-run
            # does when it cannot rely on systemd user services).
            a11y_launcher="$(ls /usr/libexec/at-spi-bus-launcher \
              /usr/lib/at-spi2-core/at-spi-bus-launcher 2>/dev/null | head -n1)"
            a11y_registry="$(ls /usr/libexec/at-spi2-registryd \
              /usr/lib/at-spi2-core/at-spi2-registryd 2>/dev/null | head -n1)"
            "$a11y_launcher" --launch-immediately &
            "$a11y_registry" &
            for _ in $(seq 1 20); do
              dbus-send --print-reply=literal --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.ListNames 2>/dev/null | grep -q org.a11y.Bus && break
              sleep 0.5
            done
            export AT_SPI_BUS_ADDRESS="$(dbus-send --print-reply=literal \
              --dest=org.a11y.Bus /org/a11y/bus org.a11y.Bus.GetAddress | tr -d ' ')"

            # Mock Ollama backend.
            python3 tests/e2e/mock_ollama.py 11434 &

            # The AT-SPI WebDriver server.
            (cd /tmp/swa \
              && FLASK_APP=selenium-webdriver-at-spi.py flask run --port 4723 --no-reload \
              &> "$RUNNER_TEMP/webdriver.log") &
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:4723/status && break
              sleep 0.5
            done

            export OCAPI_E2E_APP="$PWD/build/src/ocapi"
            export OCAPI_E2E_MOCK_PORT=11434
            export XDG_CACHE_HOME="$RUNNER_TEMP/xdg/CACHE" \
                   XDG_CONFIG_HOME="$RUNNER_TEMP/xdg/CONFIG" \
                   XDG_DATA_HOME="$RUNNER_TEMP/xdg/DATA" \
                   XDG_STATE_HOME="$RUNNER_TEMP/xdg/STATE"
            python3 tests/e2e/ocapi_e2e_test.py
          SCRIPT

      - name: Collect logs
        if: always()
        run: |
          cat "$RUNNER_TEMP/webdriver.log" || true
          ls tests/e2e || true
          cat appium_artifact_* 2>/dev/null || true

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev cmake ninja-build clang-tidy

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DOCAPI_ENABLE_CLANG_TIDY=ON
      - name: Run clang-tidy
        run: |
          cmake --build build 2>&1 | tee tidy.log
          if grep -E '(^| )(warning|error): ' tidy.log; then
            echo "clang-tidy reported issues"
            exit 1
          fi
