name: Release packages

# Manually triggered release workflow. It is intentionally NOT part of the
# CI pipeline (see ci.yml): run it from the Actions tab ("Release packages"
# -> "Run workflow") to build installable packages for Linux and Windows.
#
# The version defaults to the current UTC date (YYYY.MM.DD) and can be
# overridden with the "version" input. All artifacts are uploaded to the
# workflow run and, if a GitHub release exists for the tag
# "v<version>", attached to it as release assets.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (default: current UTC date, YYYY.MM.DD)"
        required: false
        default: ""
      attach_to_release:
        description: "Attach artifacts to the GitHub release for tag v<version> (if it exists)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="$(date -u +%Y.%m.%d)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo ">> Package version: $VERSION"

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive flathub org.kde.Sdk//6.10 org.kde.Platform//6.10

      - name: Build Flatpak bundle
        run: packaging/flatpak/build-flatpak.sh "${{ needs.version.outputs.version }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocapi-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  rpm:
    name: RPM package
    runs-on: ubuntu-latest
    needs: version
    container:
      # Fedora provides rpmbuild and the qt6-qtbase-devel packages that the
      # spec's BuildRequires names expect.
      image: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build cmake ninja-build gcc-c++ qt6-qtbase-devel \
            qt6-qtbase-gui git-core

      - name: Build RPM
        run: packaging/rpm/build-rpm.sh "${{ needs.version.outputs.version }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocapi-rpm
          path: dist/*.rpm
          if-no-files-found: error

  deb:
    name: DEB package
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite libgl-dev \
            dpkg-dev fakeroot

      - name: Build DEB
        run: packaging/deb/build-deb.sh "${{ needs.version.outputs.version }}" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocapi-deb
          path: dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows packages (MSIX, MSI, EXE)
    runs-on: windows-2022
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 2022 x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.2
          arch: win64_msvc2022_64
          modules: qtmultimedia qtwebsockets

      - name: Resolve Qt directory
        shell: pwsh
        run: |
          $qtDir = "${{ env.QtDir }}\6.8.2\msvc2022_64"
          if (-not (Test-Path (Join-Path $qtDir "bin\windeployqt.exe"))) {
            throw "windeployqt not found under $qtDir"
          }
          echo "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ">> Qt6_DIR=$qtDir"

      - name: Install WiX toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$HOME\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSIX
        shell: pwsh
        run: |
          packaging\windows\build-msix.ps1 -Version "${{ needs.version.outputs.version }}" -OutDir dist

      - name: Build MSI
        shell: pwsh
        run: |
          packaging\windows\build-msi.ps1 -Version "${{ needs.version.outputs.version }}" -OutDir dist

      - name: Build EXE installer
        shell: pwsh
        run: |
          packaging\windows\build-exe.ps1 -Version "${{ needs.version.outputs.version }}" -OutDir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocapi-windows
          path: |
            dist/*.msix
            dist/*.msi
            dist/*.exe
          if-no-files-found: error

  publish:
    name: Publish to GitHub release
    runs-on: ubuntu-latest
    needs: [version, flatpak, rpm, deb, windows]
    if: ${{ inputs.attach_to_release == true }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Attach to release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.version.outputs.version }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo ">> No release found for tag $TAG; creating a draft release."
            gh release create "$TAG" --draft --title "ocapi $TAG" --notes "Automated package build for $TAG. All packages are unsigned."
          fi
          gh release upload "$TAG" artifacts/* --clobber
          echo ">> Uploaded to release $TAG"
