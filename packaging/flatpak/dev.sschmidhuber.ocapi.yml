# Flatpak manifest for ocapi.
#
# Build a local bundle with:
#   packaging/flatpak/build-flatpak.sh
#
# The manifest builds ocapi from the git checkout that contains it (the
# script passes the source directory). The KDE Platform/Sdk 6.10 runtime
# provides Qt 6.10 (Widgets, Network, Sql); the optional
# poppler/tesseract/libarchive integrations are left out of the sandbox
# on purpose (the app works without them, they only enable attachment
# text extraction).
id: dev.sschmidhuber.ocapi
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: ocapi

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=xdg-data/sschmidhuber:create

modules:
  - name: ocapi
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOCAPI_BUILD_TESTS=OFF
    sources:
      - type: dir
        path: ../..
