<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="katex.min.css" />
    <link rel="stylesheet" href="highlight-github.css" />
    <style id="theme">
      :root {
        --bg: #ffffff;
        --fg: #1b1b1b;
        --muted: #6a6a6a;
        --bubble-user: #d6e9ff;
        --border: #d0d0d0;
        --code-bg: #f0f0f0;
        --link: #2a82da;
        --accent: #3a7bd5;
      }
      html.dark {
        --bg: #1e1e1e;
        --fg: #e0e0e0;
        --muted: #9a9a9a;
        --bubble-user: #2d4a6b;
        --border: #444;
        --code-bg: #2d2d2d;
        --link: #6aa9ff;
        --accent: #5b9bd5;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      #log {
        padding: 8px 12px 16px;
      }
      .msg {
        margin: 10px 0;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 92%;
        overflow-wrap: break-word;
      }
      .msg.user {
        background: var(--bubble-user);
        margin-left: auto;
      }
      /* Assistant messages have no bubble; consecutive ones (user message,
     thinking, tool call, assistant answer) must sit as close together as
     rows of one turn, so override the default 10px message margin. */
      .msg.assistant {
        background: transparent;
        padding: 2px 0;
        max-width: 100%;
        margin: 1px 0;
        margin-right: auto;
      }
      /* Thinking and tool-call rows are their own elements (not .msg), without
     the message spacing. */
      .element-row {
        margin: 0;
        padding: 0;
      }
      .element-row summary {
        padding-top: 0;
        padding-bottom: 0;
      }
      .msg.tool {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .msg pre {
        background: var(--code-bg);
        padding: 8px;
        border-radius: 6px;
        overflow-x: auto;
      }
      .msg code {
        font-family: monospace;
        background: var(--code-bg);
        padding: 1px 4px;
        border-radius: 4px;
      }
      .msg pre code {
        background: transparent;
        padding: 0;
      }
      .msg a {
        color: var(--link);
      }
      .msg table {
        border-collapse: collapse;
      }
      .msg th,
      .msg td {
        border: 1px solid var(--border);
        padding: 4px 8px;
      }
      .msg blockquote {
        border-left: 3px solid var(--border);
        margin-left: 0;
        padding-left: 10px;
        color: var(--muted);
      }
      .thinking {
        color: var(--muted);
        margin: 0;
        font-size: 13px;
      }
      .thinking summary {
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .thinking summary .chev {
        width: 12px;
        height: 12px;
        display: inline-block;
        transition: transform 0.15s;
      }
      .thinking[open] summary .chev {
        transform: rotate(90deg);
      }
      .thinking .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--muted);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .thinking .reasoning-body {
        font-style: italic;
        border-left: 3px solid var(--border);
        padding: 4px 0 4px 10px;
        margin-top: 4px;
        white-space: pre-wrap;
      }
      .msg .body:empty {
        display: none;
      }
      .toolcall {
        color: var(--muted);
        font-size: 13px;
      }
      .toolcall summary {
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 0;
      }
      .toolcall summary .chev {
        width: 12px;
        height: 12px;
        display: inline-block;
        transition: transform 0.15s;
      }
      .toolcall[open] summary .chev {
        transform: rotate(90deg);
      }
      .toolcall summary .tc-name {
        font-family: monospace;
      }
      .toolcall summary .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--muted);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .toolcall .tc-body {
        border-left: 3px solid var(--border);
        padding: 4px 0 4px 10px;
        margin-top: 4px;
      }
      .toolcall .tc-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 4px 0 2px;
      }
      .toolcall .tc-body pre {
        margin: 2px 0;
      }
      .toolcall .tc-result {
        white-space: pre-wrap;
      }
      .cursor::after {
        content: '\2588';
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .katex-display {
        margin: 8px 0;
      }
      /* Below the copy button the gap must be larger than the 4px between the
     assistant message and the button itself. */
      .msg .actions {
        margin-top: 4px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .msg .actions .copy-btn {
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      /* Attachments below the text of user messages, analogous to the
     composer's attachment strip: thumbnail with the file name below it. */
      .msg .attachments {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 8px;
        margin-top: 6px;
        padding-bottom: 2px;
      }
      .msg .att {
        width: 140px;
        flex: 0 0 auto; /* never shrink: overflow -> horizontal scrollbar */
      }
      .msg .att .att-thumb {
        display: block;
        width: 128px;
        height: 128px;
        object-fit: cover;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--code-bg);
      }
      .msg .att .att-thumb.ph {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
      }
      .msg .att .att-name {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg .actions .throughput {
        color: var(--muted);
        font-size: 12px;
        user-select: none;
      }
      .msg .actions .edit-btn {
        color: var(--muted);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px;
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .msg .actions .edit-btn:hover {
        color: var(--fg);
      }
      .msg .actions .edit-btn svg.icon {
        width: 14px;
        height: 14px;
      }
      .msg .actions .copy-btn:hover {
        color: var(--fg);
        border-color: var(--muted);
      }
      .msg .actions .copy-btn svg.icon {
        width: 16px;
        height: 16px;
      }
      /* "Move to Bottom" button, bottom-right over the chat: shown while
     content extends below the visible area (e.g. a streaming answer the
     capped auto-scroll keeps below the fold). */
      #jump-btn {
        position: fixed;
        right: 16px;
        bottom: 16px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease;
      }
      #jump-btn.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #jump-btn:hover {
        color: var(--fg);
        border-color: var(--muted);
      }
      #jump-btn svg {
        width: 16px;
        height: 16px;
      }
    </style>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
      // Initialized asynchronously; the C++ side pushes messages only after the
      // page finished loading, but clicks can also arrive before the channel is
      // up, so every bridge use must handle a null bridge.
      window.qtBridge = null;
      if (typeof qt !== 'undefined' && qt.webChannelTransport) {
        new QWebChannel(qt.webChannelTransport, function (channel) {
          window.qtBridge = channel.objects.qtBridge;
        });
      }
    </script>
    <script src="marked.min.js"></script>
    <script src="katex.min.js"></script>
    <script src="highlight.min.js"></script>
    <script>
      marked.setOptions({
        breaks: true,
        gfm: true,
        highlight: function (code, lang) {
          try {
            if (lang && hljs.getLanguage(lang)) return hljs.highlight(lang, code, true).value;
            return hljs.highlightAuto(code).value;
          } catch (e) {
            return null; // let marked escape and render the code block unhighlighted
          }
        },
      });

      // Renders markdown to HTML. LaTeX math is extracted from the raw text and
      // rendered with KaTeX before marked runs, because marked consumes the
      // backslashes of the \\( \\) and \\[ \\] delimiters and would otherwise
      // leave them as literal text. Fenced code blocks and inline code are
      // stashed first so no math is extracted from them.

      // Renders a math span with KaTeX. The extraction regex below can match
      // prose that merely contains dollar signs (e.g. IPA transcriptions like
      // $ˈwɔːtəʃ$); KaTeX then logs "Unrecognized Unicode character" and "No
      // character metrics" console warnings for such input. strict:false
      // silences the strict-mode warnings, and console.warn is muted for the
      // duration of the render because the metrics warnings are not gated by
      // strict. Rendering itself still falls back gracefully (throwOnError).
      function renderMath(tex, displayMode) {
        const origWarn = console.warn;
        console.warn = function () {};
        try {
          return katex.renderToString(tex, {
            displayMode: displayMode,
            throwOnError: false,
            strict: false,
          });
        } finally {
          console.warn = origWarn;
        }
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderMarkdown(text) {
        const stash = [];
        function stashToken(s) {
          stash.push(s);
          return '@@okapi' + (stash.length - 1) + '@@';
        }

        let masked = text.replace(/(```|~~~)[\s\S]*?(?:\1|$)/g, function (m) {
          return stashToken(m);
        });
        masked = masked.replace(/`[^`\n]*`/g, function (m) {
          return stashToken(m);
        });
        masked = masked.replace(
          /\$\$([\s\S]+?)\$\$|\\+\[([\s\S]+?)\\+\]|\\+\(([^\n]+?)\\+\)|\$([^$\n]+?)\$/g,
          function (m, d1, d2, d3, d4) {
            const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : d3 !== undefined ? d3 : d4;
            const display = d1 !== undefined || d2 !== undefined;
            return stashToken(renderMath(tex, display));
          },
        );

        let html = marked.parse(masked);
        for (let i = 0; i < stash.length; i++) {
          const token = '@@okapi' + i + '@@';
          let replacement = stash[i];
          if (replacement.charAt(0) === '`' && replacement.charAt(1) === '`')
            replacement = marked.parse(replacement); // fenced code block
          else if (replacement.charAt(0) === '`') replacement = marked.parseInline(replacement); // inline code span
          html = html.split(token).join(replacement);
        }
        return html;
      }

      function showCopied(el) {
        const copyBtn = el.querySelector('.copy-btn');
        if (!copyBtn) return;
        copyBtn.innerHTML =
          '<svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>';
        copyBtn.style.color = 'var(--accent)';
        clearTimeout(copyBtn._timer);
        copyBtn._timer = setTimeout(function () {
          copyBtn.style.color = '';
          copyBtn.innerHTML =
            '<svg class="icon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15 h-1.5 a1 1 0 0 1 -1 -1 v-10.5 a1 1 0 0 1 1 -1 h10.5 a1 1 0 0 1 1 1 v1.5"/></g></svg>';
        }, 1500);
      }

      // Copies a message's raw (markdown) content through the Qt clipboard via
      // the web channel bridge, with JS clipboard fallbacks.
      function copyMessageContent(id) {
        const el = document.getElementById('msg-' + id);
        if (!el) return;
        const text = el.dataset.raw || '';
        if (!text) return;
        if (window.qtBridge && window.qtBridge.copyToClipboard) {
          window.qtBridge.copyToClipboard(text);
          showCopied(el);
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () {
              showCopied(el);
            },
            function () {},
          );
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showCopied(el);
        }
      }

      function createThinkingElement(idx) {
        const d = document.createElement('details');
        d.className = 'thinking';
        d.dataset.token = 'thinking:' + idx;
        d.innerHTML =
          '<summary>' +
          '<svg class="chev" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m6 3 5 5-5 5-1-1 4-4-4-4z"/></svg>' +
          '<span class="tlabel">Thinking</span>' +
          '<span class="spinner" style="display:none"></span></summary>' +
          '<div class="reasoning-body"></div>';
        // Collapse each phase on first appearance.
        d.removeAttribute('open');
        return d;
      }

      function createToolCallElement(idx) {
        const d = document.createElement('details');
        d.className = 'toolcall';
        d.dataset.token = 'tool:' + idx;
        d.innerHTML =
          '<summary><svg class="chev" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m6 3 5 5-5 5-1-1 4-4-4-4z"/></svg>' +
          '<span class="tc-name"></span>' +
          '<span class="spinner" style="display:none"></span></summary>' +
          '<div class="tc-body">' +
          '<div class="tc-label">Parameters</div>' +
          '<pre><code class="tc-params"></code></pre>' +
          '<div class="tc-result-wrap" style="display:none">' +
          '<div class="tc-label">Result</div>' +
          '<div class="tc-result"></div></div></div>';
        return d;
      }

      function updateThinkingElement(d, idx, segment, reasoningStreaming, segmentCount) {
        d.querySelector('.reasoning-body').textContent = segment;
        d.querySelector('.spinner').style.display =
          reasoningStreaming && idx === segmentCount - 1 ? '' : 'none';
      }

      function updateToolCallElement(d, call) {
        // Display "server: tool"; the internal name uses "server__tool"
        // (split on the first "__", the server name itself may contain it).
        d.querySelector('.tc-name').textContent = call.name.replace('__', ': ');
        d.querySelector('.tc-params').textContent = JSON.stringify(call.arguments || {}, null, 2);
        d.querySelector('.spinner').style.display = call.status === 'running' ? '' : 'none';
        const resultWrap = d.querySelector('.tc-result-wrap');
        if (call.status !== 'running' && call.result) {
          resultWrap.style.display = '';
          d.querySelector('.tc-result').innerHTML = renderMarkdown(call.result);
        } else {
          resultWrap.style.display = 'none';
        }
      }

      // Each thinking phase and tool call of an assistant message is rendered as
      // its own top-level element in the log (wrapped in an .element-row div),
      // strictly in the order they happened: elementOrder holds "thinking:<i>" /
      // "tool:<i>" tokens plus a "text" token marking where the answer sits, e.g.
      // a turn that thought, called a tool, thought again and called another tool
      // renders Thinking, tool call, Thinking, tool call as separate elements —
      // not all thinkings first. Elements recorded before "text" are placed above
      // the assistant message element, later ones below it; a turn that answers
      // first and only then calls tools shows the tool calls under the answer.
      // Messages without a recorded order (persisted before ordering existed)
      // fall back to all thinking phases, then all tool calls, above the answer.
      // The user's expand/collapse choice per element is preserved across
      // streaming updates.
      function elementWrapper(messageId, token, thinking, toolCalls, reasoningStreaming) {
        let wrap = document.getElementById('msg-' + messageId + '-' + token);
        if (!wrap) {
          wrap = document.createElement('div');
          wrap.className = 'element-row';
          wrap.id = 'msg-' + messageId + '-' + token;
          const parts = token.split(':');
          wrap.appendChild(
            parts[0] === 'thinking'
              ? createThinkingElement(parts[1])
              : createToolCallElement(parts[1]),
          );
        }
        const d = wrap.firstChild;
        const idx = Number(token.split(':')[1]);
        if (token.startsWith('thinking:'))
          updateThinkingElement(d, idx, thinking[idx], reasoningStreaming, thinking.length);
        else updateToolCallElement(d, toolCalls[idx]);
        return wrap;
      }

      function renderAssistantElements(
        messageId,
        thinking,
        toolCalls,
        elementOrder,
        reasoningStreaming,
      ) {
        const log = document.getElementById('log');
        const bodyEl = document.getElementById('msg-' + messageId);
        const rawTokens = elementOrder || [];
        const textIdx = rawTokens.indexOf('text');
        const above = [];
        const below = [];
        for (let i = 0; i < rawTokens.length; i++) {
          const t = String(rawTokens[i]);
          const parts = t.split(':');
          let valid = false;
          if (parts[0] === 'thinking') valid = Number(parts[1]) < thinking.length;
          else if (parts[0] === 'tool') valid = Number(parts[1]) < toolCalls.length;
          if (!valid) continue; // includes the 'text' token itself
          (textIdx === -1 || i < textIdx ? above : below).push(t);
        }
        if (!above.length && !below.length) {
          for (let i = 0; i < thinking.length; i++) above.push('thinking:' + i);
          for (let i = 0; i < toolCalls.length; i++) above.push('tool:' + i);
        }
        const aboveW = above.map(function (t) {
          return elementWrapper(messageId, t, thinking, toolCalls, reasoningStreaming);
        });
        const belowW = below.map(function (t) {
          return elementWrapper(messageId, t, thinking, toolCalls, reasoningStreaming);
        });
        // Position the elements. Only (re)insert when the element is not already
        // at its position: insertBefore removes and re-inserts the node even
        // within the same parent, which would restart the spinner's CSS
        // animation on every streaming update.
        if (!bodyEl || !bodyEl.parentNode) {
          // The assistant message has no answer text (yet), so it is not in the
          // log as an element; its thinking/tool-call rows go to the end of the
          // log in their recorded order. Only touch the DOM when the wrappers
          // are not already the last children in the desired order:
          // insertBefore removes and re-inserts a node even within the same
          // parent, which restarts the spinner's CSS animation on every
          // streaming update (the old "w.previousSibling !== tail" guard
          // re-inserted the last wrapper on every update).
          const allW = aboveW.concat(belowW);
          let inPlace = true;
          let node = log.lastChild;
          for (let k = allW.length - 1; k >= 0; k--) {
            if (node !== allW[k]) {
              inPlace = false;
              break;
            }
            node = node ? node.previousSibling : null;
          }
          if (!inPlace) {
            let tail = log.lastChild;
            for (const w of allW) {
              log.insertBefore(w, tail ? tail.nextSibling : log.firstChild);
              tail = w;
            }
          }
        } else {
          for (let k = aboveW.length - 1; k >= 0; k--) {
            const desiredNext = k + 1 < aboveW.length ? aboveW[k + 1] : bodyEl;
            if (aboveW[k].nextSibling !== desiredNext) log.insertBefore(aboveW[k], desiredNext);
          }
          let anchor = bodyEl;
          for (const w of belowW) {
            if (w.previousSibling !== anchor) log.insertBefore(w, anchor.nextSibling);
            anchor = w;
          }
        }
        // Drop this message's element wrappers whose token is no longer present
        // (e.g. after a reload).
        const wanted = {};
        for (const w of aboveW.concat(belowW)) wanted[w.id] = true;
        for (const el of log.querySelectorAll(':scope > .element-row')) {
          if (el.id.startsWith('msg-' + messageId + '-') && !wanted[el.id]) el.remove();
        }
      }

      // Append or update one message. id = message id; role: user|assistant|tool;
      // toolCalls = array of {id, name, arguments, status, result} in call order;
      // elementOrder = ["thinking:<i>", "tool:<i>", ..., "text", ...] tokens in
      // display order; "text" marks where the answer sits among the elements.
      // Global UI flags set from the C++ side (Settings > General > User
      // Interface); setShowThroughput() is called on page load and on change.
      var showThroughput = false;
      function setShowThroughput(enabled) {
        showThroughput = enabled;
      }

      // Renders a message's attachments below its text (user messages),
      // analogous to the composer's attachment strip: 64px thumbnail with
      // the file name below it.
      function renderAttachments(el, attachments) {
        let box = el.querySelector('.attachments');
        const images = (attachments && attachments.images) || [];
        const files = (attachments && attachments.files) || [];
        if (!images.length && !files.length) {
          if (box) box.remove();
          return;
        }
        if (!box) {
          box = document.createElement('div');
          box.className = 'attachments';
          const actions = el.querySelector('.actions');
          el.insertBefore(box, actions); // below the body, above the actions
          // Wheel over the row scrolls it horizontally (the page itself
          // must not scroll while the pointer is over the attachments).
          box.addEventListener(
            'wheel',
            function (ev) {
              if (box.scrollWidth > box.clientWidth && Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) {
                ev.preventDefault();
                box.scrollLeft += ev.deltaY;
              }
            },
            { passive: false },
          );
        }
        box.innerHTML = '';
        const chip = function (thumbSrc, placeholder, fileName, sourcePath) {
          const att = document.createElement('div');
          att.className = 'att';
          att.title = fileName; // full file name as tooltip
          att.dataset.path = sourcePath || '';
          att.style.cursor = sourcePath ? 'pointer' : 'default';
          const thumb = document.createElement(thumbSrc ? 'img' : 'div');
          thumb.className = 'att-thumb' + (thumbSrc ? '' : ' ph');
          if (thumbSrc) thumb.src = thumbSrc;
          else thumb.textContent = placeholder;
          const name = document.createElement('div');
          name.className = 'att-name';
          name.textContent = fileName;
          att.appendChild(thumb);
          att.appendChild(name);
          return att;
        };
        for (const img of images)
          box.appendChild(
            chip(
              'data:' + (img.mimeType || 'image/png') + ';base64,' + img.data,
              '?',
              img.fileName || 'image',
              img.sourcePath,
            ),
          );
        for (const f of files) {
          const src = f.thumbnail ? 'data:image/png;base64,' + f.thumbnail : null;
          box.appendChild(chip(src, '?', f.fileName || 'file', f.sourcePath));
        }
      }

      function setMessage(
        id,
        role,
        content,
        streaming,
        thinking,
        reasoningStreaming,
        toolCalls,
        elementOrder,
        tokensPerSecond,
        attachments,
      ) {
        let el = document.getElementById('msg-' + id);
        const isNewElement = !el;
        if (!el) {
          el = document.createElement('div');
          el.id = 'msg-' + id;
          el.className = 'msg ' + role;
          // Tool results are shown inside the requesting assistant message's
          // collapsible tool-call entries, not as separate bubbles.
          // Tool results live inside the tool-call entries; the system
          // prompt is sent to the model but never shown as a bubble.
          if (role === 'tool' || role === 'system') el.style.display = 'none';
          el.innerHTML = '<div class="body"></div>';
          // The copy button under user and assistant messages copies that
          // message's raw content (el.dataset.raw of this message).
          if (role === 'assistant' || role === 'user') {
            const actions = document.createElement('div');
            actions.className = 'actions';
            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.innerHTML =
              '<svg class="icon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15 h-1.5 a1 1 0 0 1 -1 -1 v-10.5 a1 1 0 0 1 1 -1 h10.5 a1 1 0 0 1 1 1 v1.5"/></g></svg>';
            btn.addEventListener('click', function (ev) {
              ev.stopPropagation();
              copyMessageContent(id);
            });
            el.appendChild(actions);
            actions.appendChild(btn);
            // Hide the copy button while the answer is still streaming.
            btn.style.display = 'none';
            if (role === 'user') {
              // Breeze document-edit-symbolic: edit loads the message into
              // the composer (text + attachments).
              const editBtn = document.createElement('button');
              editBtn.className = 'edit-btn';
              editBtn.title = 'Edit message';
              editBtn.setAttribute('aria-label', 'Edit message');
              editBtn.innerHTML =
                '<svg class="icon" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m14.996094 3-11.992188 11.992188h-.003906v4.00781h1 2 1.00781v-.003906l11.992188-11.992188-.001953-.001953.001953-.001953-4-4-.001953.001953-.001953-.001953m-1.998047 3.412109 2.589844 2.589844-7.587891 7.587891v-1.589844h-1-1v-1-.589844l6.998047-6.998047m-7.998047 7.998047v1.589844h1 1v1 .589844l-.410156.410156h-1.589844l-1-1v-1.589844 1-1"/></svg>';
              editBtn.addEventListener('click', function (ev) {
                ev.stopPropagation();
                if (window.qtBridge) window.qtBridge.editMessage(id);
              });
              actions.appendChild(editBtn);
              editBtn.style.display = 'none';
            }
            // Throughput (t/s) sits right next to the copy button; hidden
            // until the toggle is on and a throughput value is known.
            // Assistant messages only.
            if (role === 'assistant') {
              const throughput = document.createElement('span');
              throughput.className = 'throughput';
              throughput.style.display = 'none';
              actions.appendChild(throughput);
            }
          }
          // An assistant message without answer text (e.g. a round that only
          // requested tool calls) must not appear as an empty element in the
          // log; it is attached once it has content, at its recorded position.
          if (role !== 'assistant' || content) {
            const log = document.getElementById('log');
            if (role === 'assistant') {
              const raw = elementOrder || [];
              const textIdx = raw.indexOf('text');
              let ref = null;
              if (textIdx !== -1) {
                for (let i = textIdx + 1; i < raw.length; i++) {
                  ref = document.getElementById('msg-' + id + '-' + raw[i]);
                  if (ref) break;
                }
              }
              log.insertBefore(el, ref); // ref null -> append at the end
            } else {
              log.appendChild(el);
            }
          }
        } else if (role === 'assistant' && !content && el.parentNode) {
          el.remove();
        }
        el.dataset.raw = content;
        const body = el.querySelector('.body');
        if (role === 'user') {
          // User content is untrusted: escape raw HTML before markdown
          // rendering so injected markup cannot execute; markdown itself
          // (links, code, emphasis) still renders.
          body.innerHTML = content ? renderMarkdown(escapeHtml(content)) : '';
          renderAttachments(el, attachments || {});
        } else {
          // Empty content (e.g. a message that only requested tool calls) must
          // not render an empty <p>, which would add a blank line between the
          // Thinking/tool-call rows and the answer.
          body.innerHTML = content ? renderMarkdown(content) : '';
          if (streaming) body.classList.add('cursor');
          else body.classList.remove('cursor');
        }
        // Show the copy button for assistant messages only when streaming is done
        // and the message actually has answer content; a message that only
        // requested tool calls (empty body) must not get a button below the
        // tool-call row.
        const hasAttachments =
          attachments &&
          ((attachments.images && attachments.images.length) ||
            (attachments.files && attachments.files.length));
        if (
          (role === 'assistant' || role === 'user') &&
          !streaming &&
          (content || hasAttachments)
        ) {
          const copyBtn = el.querySelector('.copy-btn');
          if (copyBtn) copyBtn.style.display = '';
          const editBtn = el.querySelector('.edit-btn');
          if (editBtn && role === 'user') editBtn.style.display = '';
        }
        // Output token throughput next to the copy button, e.g. "32 t/s"
        // with tooltip "32 output token/s"; only when the toggle is on and
        // the message has a known throughput (set when its stream finished).
        const throughputEl = role === 'assistant' ? el.querySelector('.throughput') : null;
        if (throughputEl) {
          if (showThroughput && typeof tokensPerSecond === 'number' && tokensPerSecond > 0) {
            const rounded = Math.round(tokensPerSecond);
            throughputEl.textContent = rounded + ' t/s';
            throughputEl.title = rounded + ' output token/s';
            throughputEl.style.display = '';
          } else {
            throughputEl.style.display = 'none';
          }
        }
        if (role === 'assistant') {
          renderAssistantElements(
            id,
            thinking || [],
            toolCalls || [],
            elementOrder,
            streaming && reasoningStreaming,
          );
        }
        el.dataset.streaming = streaming;
        // A user message (re-)engages the automatic scrolling: sending a
        // message implies the user wants to watch this turn.
        if (role === 'user') autoScroll = true;
        // Scroll only for user messages, freshly created elements (history
        // loads and session renders should end at the bottom) and while an
        // answer streams (capped at the last user message). A live
        // non-streaming update of an already rendered message — stream
        // finish, throughput or tool-call status change — must NOT move the
        // view: it stays at the capped auto-scroll position until the user
        // scrolls manually or presses "Move to bottom". Hidden rows
        // (tool/system) never affect the scroll position.
        if (role === 'tool' || role === 'system') {
          // Hidden rows never scroll.
        } else if (role === 'user' || isNewElement || streaming) {
          followContent(streaming);
        } else {
          updateJumpButton();
        }
      }

      // Removes the message with the given id and all later messages from the
      // log (used after a user message was edited and resent).
      function removeMessagesFrom(id) {
        const start = document.getElementById('msg-' + id);
        if (!start) return;
        let node = start;
        while (node) {
          const next = node.nextSibling;
          if (node.id && node.id.startsWith('msg-')) node.remove();
          node = next;
        }
      }

      function clearLog() {
        document.getElementById('log').innerHTML = '';
      }

      // Auto-scroll state: while the model works, the view follows the
      // content only as far as the last user message stays fully visible;
      // any user scroll immediately stops the automatic scrolling.
      var autoScroll = true;
      var programmaticScroll = false;
      var programmaticTarget = 0;

      function lastUserMessage() {
        var msgs = document.querySelectorAll('#log > .msg.user');
        return msgs.length ? msgs[msgs.length - 1] : null;
      }

      function updateJumpButton() {
        var below = document.body.scrollHeight - window.scrollY - window.innerHeight;
        document.getElementById('jump-btn').classList.toggle('visible', below > 40);
      }

      function programmaticScrollTo(target) {
        programmaticScroll = true;
        programmaticTarget = target;
        window.scrollTo(0, target);
      }

      function followContent(streaming) {
        if (!autoScroll) {
          updateJumpButton();
          return;
        }
        if (!streaming) {
          // History loads and finished answers show the full content.
          programmaticScrollTo(Math.max(0, document.body.scrollHeight - window.innerHeight));
        } else {
          // While the answer streams, never scroll past the last user message:
          // it must stay fully visible while the model works on it.
          var viewportH = window.innerHeight;
          var target = Math.max(0, document.body.scrollHeight - viewportH);
          var userMsg = lastUserMessage();
          if (userMsg) {
            var rect = userMsg.getBoundingClientRect();
            var top = rect.top + window.scrollY;
            var bottom = rect.bottom + window.scrollY;
            var cap = Math.max(top, bottom - viewportH);
            target = Math.min(target, Math.max(0, cap));
          }
          programmaticScrollTo(target);
        }
        // signal scroll position for "load older" detection
        if (window.scrollY < 40 && window.qtBridge) window.qtBridge.notifyScrolledToTop();
        updateJumpButton();
      }

      function scrollToBottom() {
        programmaticScrollTo(Math.max(0, document.body.scrollHeight - window.innerHeight));
        if (window.scrollY < 40 && window.qtBridge) window.qtBridge.notifyScrolledToTop();
        updateJumpButton();
      }

      window.addEventListener('scroll', function () {
        if (programmaticScroll && Math.abs(window.scrollY - programmaticTarget) < 2) {
          programmaticScroll = false;
        } else {
          // The user scrolled: stop following the content immediately.
          autoScroll = false;
        }
        updateJumpButton();
        if (window.scrollY < 40 && window.qtBridge) window.qtBridge.notifyScrolledToTop();
      });
      window.addEventListener('wheel', function () {
        autoScroll = false;
        updateJumpButton();
      });
      window.addEventListener('resize', updateJumpButton);

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('jump-btn').addEventListener('click', function () {
          autoScroll = true;
          scrollToBottom();
        });
        // Links in chat messages open in the default web browser (via the
        // qtBridge), never navigate the web view itself; while hovering a
        // link, its URL is reported so the host can show it in its status
        // bar (empty string when the pointer leaves the link).
        const log = document.getElementById('log');
        log.addEventListener('click', function (ev) {
          // File elements in user messages open the file in the default app.
          const att = ev.target.closest('.att');
          if (att) {
            ev.preventDefault();
            if (window.qtBridge && att.dataset.path)
              window.qtBridge.openAttachment(att.dataset.path);
            return;
          }
          const a = ev.target.closest('a');
          if (!a) return;
          ev.preventDefault();
          if (window.qtBridge) window.qtBridge.openUrl(a.href);
        });
        log.addEventListener('mouseover', function (ev) {
          if (!window.qtBridge) return;
          const a = ev.target.closest('a');
          window.qtBridge.hoverLink(a ? a.href : '');
        });
      });

      function setTheme(dark) {
        document.documentElement.classList.toggle('dark', dark);
      }
    </script>
  </head>
  <body>
    <div id="log"></div>
    <button id="jump-btn" title="Move to Bottom" aria-label="Move to Bottom">
      <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 11.707l-6-6L2.707 5 8 10.293 13.293 5l.707.707-6 6z" fill="currentColor" />
      </svg>
    </button>
  </body>
</html>
