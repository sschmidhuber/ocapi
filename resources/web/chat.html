<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="highlight-github.css">
<style id="theme">
  :root {
    --bg: #ffffff; --fg: #1b1b1b; --muted: #6a6a6a; --bubble-user: #d6e9ff;
    --border: #d0d0d0; --code-bg: #f0f0f0;
    --link: #2a82da; --accent: #3a7bd5;
  }
  html.dark {
    --bg: #1e1e1e; --fg: #e0e0e0; --muted: #9a9a9a; --bubble-user: #2d4a6b;
    --border: #444; --code-bg: #2d2d2d;
    --link: #6aa9ff; --accent: #5b9bd5;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: sans-serif; font-size: 14px; line-height: 1.5; }
  #log { padding: 8px 12px 16px; }
  .msg { margin: 10px 0; padding: 8px 12px; border-radius: 8px; max-width: 92%;
    overflow-wrap: break-word; }
  .msg.user { background: var(--bubble-user); margin-left: auto; }
  .msg.assistant { background: transparent; padding: 4px 0; max-width: 100%;
    margin-right: auto; }
  .msg.tool { background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 12px; }
  .msg pre { background: var(--code-bg); padding: 8px; border-radius: 6px;
    overflow-x: auto; }
  .msg code { font-family: monospace; background: var(--code-bg); padding: 1px 4px;
    border-radius: 4px; }
  .msg pre code { background: transparent; padding: 0; }
  .msg a { color: var(--link); }
  .msg table { border-collapse: collapse; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 4px 8px; }
  .msg blockquote { border-left: 3px solid var(--border); margin-left: 0;
    padding-left: 10px; color: var(--muted); }
  .msg .thinking { color: var(--muted); }
  .msg .thinking summary { cursor: pointer; font-style: italic; user-select: none;
    display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .msg .thinking summary .chev { width: 12px; height: 12px; display: inline-block;
    transition: transform 0.15s; }
  .msg .thinking[open] summary .chev { transform: rotate(90deg); }
  .msg .thinking .spinner { display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%;
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg .thinking .reasoning-body { font-style: italic; border-left: 3px solid var(--border);
    padding: 4px 0 4px 10px; margin-top: 4px; white-space: pre-wrap; }
  .msg .toolcalls { margin: 2px 0; }
  .msg .toolcall { color: var(--muted); }
  .msg .toolcall summary { cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .msg .toolcall summary .chev { width: 12px; height: 12px; display: inline-block;
    transition: transform 0.15s; }
  .msg .toolcall[open] summary .chev { transform: rotate(90deg); }
  .msg .toolcall summary .tc-name { font-family: monospace; }
  .msg .toolcall summary .spinner { display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%;
    animation: spin 0.8s linear infinite; }
  .msg .toolcall .tc-body { border-left: 3px solid var(--border);
    padding: 4px 0 4px 10px; margin-top: 4px; }
  .msg .toolcall .tc-label { font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 4px 0 2px; }
  .msg .toolcall .tc-body pre { margin: 2px 0; }
  .msg .toolcall .tc-result { white-space: pre-wrap; }
  .cursor::after { content: "\2588"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .katex-display { margin: 8px 0; }
  .msg .actions { margin-top: 4px; display: flex; align-items: center; gap: 8px; }
  .msg .actions .copy-btn { color: var(--muted);
    background: transparent; border: 1px solid var(--border); border-radius: 4px;
    padding: 2px; cursor: pointer; width: 24px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center; }
  .msg .actions .copy-btn:hover { color: var(--fg); border-color: var(--muted); }
  .msg .actions .copy-btn svg.icon { width: 16px; height: 16px; }
</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  // Initialized asynchronously; the C++ side pushes messages only after the
  // page finished loading, but clicks can also arrive before the channel is
  // up, so every bridge use must handle a null bridge.
  window.qtBridge = null;
  if (typeof qt !== 'undefined' && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, function(channel) {
      window.qtBridge = channel.objects.qtBridge;
    });
  }
</script>
<script src="marked.min.js"></script>
<script src="katex.min.js"></script>
<script src="highlight.min.js"></script>
<script>
  marked.setOptions({ breaks: true, gfm: true, highlight: function(code, lang) {
    try {
      if (lang && hljs.getLanguage(lang)) return hljs.highlight(lang, code, true).value;
      return hljs.highlightAuto(code).value;
    } catch (e) {
      return null; // let marked escape and render the code block unhighlighted
    }
  }});

  // Renders markdown to HTML. LaTeX math is extracted from the raw text and
  // rendered with KaTeX before marked runs, because marked consumes the
  // backslashes of the \\( \\) and \\[ \\] delimiters and would otherwise
  // leave them as literal text. Fenced code blocks and inline code are
  // stashed first so no math is extracted from them.
  function renderMarkdown(text) {
    const stash = [];
    function stashToken(s) {
      stash.push(s);
      return '@@ocapi' + (stash.length - 1) + '@@';
    }

    let masked = text.replace(/(```|~~~)[\s\S]*?(?:\1|$)/g,
                              function(m) { return stashToken(m); });
    masked = masked.replace(/`[^`\n]*`/g, function(m) { return stashToken(m); });
    masked = masked.replace(
      /\$\$([\s\S]+?)\$\$|\\+\[([\s\S]+?)\\+\]|\\+\(([^\n]+?)\\+\)|\$([^$\n]+?)\$/g,
      function(m, d1, d2, d3, d4) {
        const tex = d1 !== undefined ? d1 : d2 !== undefined ? d2 : d3 !== undefined ? d3 : d4;
        const display = d1 !== undefined || d2 !== undefined;
        return stashToken(katex.renderToString(tex, {displayMode: display, throwOnError: false}));
      });

    let html = marked.parse(masked);
    for (let i = 0; i < stash.length; i++) {
      const token = '@@ocapi' + i + '@@';
      let replacement = stash[i];
      if (replacement.charAt(0) === '`' && replacement.charAt(1) === '`')
        replacement = marked.parse(replacement);      // fenced code block
      else if (replacement.charAt(0) === '`')
        replacement = marked.parseInline(replacement); // inline code span
      html = html.split(token).join(replacement);
    }
    return html;
  }

  function showCopied(el) {
    const copyBtn = el.querySelector('.copy-btn');
    if (!copyBtn) return;
    copyBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>';
    copyBtn.style.color = 'var(--accent)';
    clearTimeout(copyBtn._timer);
    copyBtn._timer = setTimeout(function() {
      copyBtn.style.color = '';
      copyBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15 h-1.5 a1 1 0 0 1 -1 -1 v-10.5 a1 1 0 0 1 1 -1 h10.5 a1 1 0 0 1 1 1 v1.5"/></g></svg>';
    }, 1500);
  }

  // Copies a message's raw (markdown) content through the Qt clipboard via
  // the web channel bridge, with JS clipboard fallbacks.
  function copyMessageContent(id) {
    const el = document.getElementById('msg-' + id);
    if (!el) return;
    const text = el.dataset.raw || '';
    if (!text) return;
    if (window.qtBridge && window.qtBridge.copyToClipboard) {
      window.qtBridge.copyToClipboard(text);
      showCopied(el);
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { showCopied(el); },
                                                function() {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showCopied(el);
    }
  }

  // Renders the tool calls of an assistant message as collapsible elements
  // (same style as "Thinking"), in call order. Collapsed shows only the tool
  // name; expanded shows the parameters (pretty JSON) and, once finished,
  // the return value. The user's expand/collapse choice is preserved across
  // streaming updates.
  function renderToolCalls(el, toolCalls) {
    let container = el.querySelector('.toolcalls');
    if (!container) {
      container = document.createElement('div');
      container.className = 'toolcalls';
      const thinking = el.querySelector('.thinking');
      el.insertBefore(container, thinking ? thinking.nextSibling : el.querySelector('.body'));
    }
    const seen = {};
    for (const call of toolCalls) {
      seen[call.id] = true;
      let d = container.querySelector('details[data-call-id="' + CSS.escape(call.id) + '"]');
      if (!d) {
        d = document.createElement('details');
        d.className = 'toolcall';
        d.dataset.callId = call.id;
        d.innerHTML = '<summary><svg class="chev" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m10 3-5 5 5 5 1-1-4-4 4-4z"/></svg>' +
                      '<span class="tc-name"></span>' +
                      '<span class="spinner" style="display:none"></span></summary>' +
                      '<div class="tc-body">' +
                      '<div class="tc-label">Parameters</div>' +
                      '<pre><code class="tc-params"></code></pre>' +
                      '<div class="tc-result-wrap" style="display:none">' +
                      '<div class="tc-label">Result</div>' +
                      '<div class="tc-result"></div></div></div>';
        container.appendChild(d);
      }
      d.querySelector('.tc-name').textContent = call.name;
      const params = JSON.stringify(call.arguments || {}, null, 2);
      const codeEl = d.querySelector('.tc-params');
      codeEl.textContent = params;
      d.querySelector('.spinner').style.display = (call.status === 'running') ? '' : 'none';
      const resultWrap = d.querySelector('.tc-result-wrap');
      if (call.status !== 'running' && call.result) {
        resultWrap.style.display = '';
        d.querySelector('.tc-result').innerHTML = renderMarkdown(call.result);
      } else {
        resultWrap.style.display = 'none';
      }
    }
    // Drop entries that no longer exist (e.g. after a reload).
    for (const d of container.querySelectorAll('details.toolcall')) {
      if (!seen[d.dataset.callId]) d.remove();
    }
    container.style.display = toolCalls.length ? '' : 'none';
  }

  // Append or update one message. id = message id; role: user|assistant|tool;
  // toolCalls = array of {id, name, arguments, status, result} in call order.
  function setMessage(id, role, content, streaming, thinking, reasoningStreaming, toolCalls) {
    let el = document.getElementById('msg-' + id);
    if (!el) {
      el = document.createElement('div');
      el.id = 'msg-' + id;
      el.className = 'msg ' + role;
      // Tool results are shown inside the requesting assistant message's
      // collapsible tool-call entries, not as separate bubbles.
      if (role === 'tool')
        el.style.display = 'none';
      el.innerHTML = (role === 'assistant'
                       ? '<details class="thinking" style="display:none"><summary>' +
                         '<svg class="chev" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill="currentColor" d="m10 3-5 5 5 5 1-1-4-4 4-4z"/></svg><span class="tlabel">Thinking</span>' +
                         '<span class="spinner" style="display:none"></span></summary>' +
                         '<div class="reasoning-body"></div></details>'
                       : '') +
                     '<div class="body"></div>';
      // The copy button exists only under the assistant's answer and copies
      // only that answer's content (el.dataset.raw of this message).
      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'actions';
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15 h-1.5 a1 1 0 0 1 -1 -1 v-10.5 a1 1 0 0 1 1 -1 h10.5 a1 1 0 0 1 1 1 v1.5"/></g></svg>';
        btn.addEventListener('click', function(ev) {
          ev.stopPropagation();
          copyMessageContent(id);
        });
        el.appendChild(actions);
        actions.appendChild(btn);
        // Hide the copy button while the answer is still streaming.
        btn.style.display = 'none';
      }
      document.getElementById('log').appendChild(el);
    }
    el.dataset.raw = content;
    const body = el.querySelector('.body');
    if (role === 'user') {
      body.textContent = content;
    } else {
      body.innerHTML = renderMarkdown(content);
      if (streaming) body.classList.add('cursor'); else body.classList.remove('cursor');
    }
    // Show copy button for assistant messages only when streaming is done
    if (role === 'assistant' && !streaming) {
      const copyBtn = el.querySelector('.copy-btn');
      if (copyBtn) copyBtn.style.display = '';
    }
    if (role === 'assistant') {
      const th = el.querySelector('.thinking');
      if (thinking) {
        const wasHidden = th.style.display === 'none';
        th.style.display = '';
        th.querySelector('.reasoning-body').textContent = thinking;
        // Collapse only on first appearance; afterwards keep the user's
        // expand/collapse choice even while tokens stream in.
        if (wasHidden) th.removeAttribute('open');
      } else {
        th.style.display = 'none';
      }
      const sp = th.querySelector('.spinner');
      sp.style.display = (streaming && reasoningStreaming) ? '' : 'none';
      renderToolCalls(el, toolCalls || []);
    }
    scrollToBottom();
  }

  function clearLog() { document.getElementById('log').innerHTML = ''; }

  function scrollToBottom() {
    window.scrollTo(0, document.body.scrollHeight);
    // signal scroll position for "load older" detection
    if (window.scrollY < 40 && window.qtBridge) window.qtBridge.notifyScrolledToTop();
  }
  window.addEventListener('scroll', function() {
    if (window.scrollY < 40 && window.qtBridge) window.qtBridge.notifyScrolledToTop();
  });

  function setTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
  }
</script>
</head>
<body>
<div id="log"></div>
</body>
</html>
